name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — build & test (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint (advisory)
        continue-on-error: true
        run: npx eslint "{src,test}/**/*.ts"

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          JWT_ACCESS_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
          JWT_REFRESH_SECRET: ci-refresh-secret-0123456789abcdef0123456789abcdef

  frontend:
    name: Frontend — typecheck & build (React/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # tsc -b runs with strict:true — this is the type gate
      - name: Typecheck & build
        run: npm run build

  migration-drift:
    name: Database — schema/migration drift gate
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_shadow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect drift between migrations and schema.prisma
        # Advisory until hand-written FK actions are reconciled with schema
        # defaults; still surfaces any MISSING table/model immediately.
        continue-on-error: true
        run: |
          DIFF=$(npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --shadow-database-url "postgresql://postgres:postgres@localhost:5432/ci_shadow" \
            --script || true)

          if [ -n "$DIFF" ]; then
            echo "::warning title=Migration drift::schema.prisma and prisma/migrations diverge"
            echo "$DIFF"
            {
              echo "### Migration drift detected"
              echo '```sql'
              echo "$DIFF"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "No drift between prisma/migrations and schema.prisma."
